# 构建并部署 GitHub Pages。
# _build/build.py 另行维护：读 data/*.json，产出 dist/。
name: deploy-pages

on:
  push:
    branches: [main]
    # scrape workflow 每天只改 raw/，无需触发重建（data/ 没变，产物相同）
    paths-ignore:
      - "raw/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # _build/build.py 仅用标准库（json/os/shutil/html），无需 pip install
      - name: Build site
        run: python _build/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
